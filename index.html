function speciesColor(sp, alpha) {
  const style = GUILD_STYLE[sp.g];
  const total = DATA.guildTotals[sp.g] || 1;
  const hueSpread = 34; // degrees of variation within a guild's colour family
  const hue = style.hue + ((sp.h / Math.max(1,total-1)) - 0.5) * hueSpread;
  const light = Math.min(92, 55 + (sp.h % 5) * 3 + (style.lift||0));
  return `hsla(${hue.toFixed(0)}, ${style.sat}%, ${light}%, ${alpha})`;
}

const spriteCache = {};
function tintedSprite(key, color) {
  const ck = key+'|'+color;
  if (spriteCache[ck]) return spriteCache[ck];
  const img = ART[key].img;
  const c = document.createElement('canvas'); c.width = img.naturalWidth; c.height = img.naturalHeight;
  const g = c.getContext('2d');
  g.drawImage(img, 0, 0);
  g.globalCompositeOperation = 'source-atop'; g.globalAlpha = (ART[key].tint !== undefined ? ART[key].tint : ART_TINT); g.fillStyle = color; g.fillRect(0,0,c.width,c.height);
  return (spriteCache[ck] = c);
}

function drawGlyph(ctx, style, x, y, s, angle, weight, vib, color, roll) {
  ctx.save();
  ctx.translate(x, y); ctx.rotate(angle);
  ctx.strokeStyle = color; ctx.lineWidth = weight;
  ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  const waver = 0;
  if (style.glyph === 'art') {
    const art = ART[style.art];
    if (art.img.complete && art.img.naturalWidth) {
      const iw = art.img.naturalWidth, ih = art.img.naturalHeight;
      const k = s * art.scale / Math.max(iw, ih);
      const w = iw * k, h = ih * k;
      if (roll) { ctx.rotate(roll.tilt); ctx.scale(1, roll.sy); ctx.globalAlpha *= roll.bright; }  // feather rolling on its long axis
      const pv = art.pivot || [0.5, 0.5];   // the point the glyph spins around (the raptor spins on its eye)
      ctx.drawImage(tintedSprite(style.art, color), -w*pv[0], -h*pv[1], w, h);
    }
  } else if (style.glyph === 'bill') {
    const len = s * style.len, bow = style.curve * s * 0.7;
    ctx.beginPath();
    ctx.moveTo(-len/2, 0);
    ctx.quadraticCurveTo(Math.sin(vib*6)*waver, -bow+Math.cos(vib*5)*waver, len/2, 0);
    ctx.stroke();
  } else if (style.glyph === 'fork') {
    const len = s * style.len, spread = style.curve;
    ctx.beginPath();
    ctx.moveTo(0,0); ctx.lineTo(-len*spread, -len*0.6+waver);
    ctx.moveTo(0,0); ctx.lineTo(len*spread, -len*0.6-waver);
    ctx.stroke();
  } else if (style.glyph === 'footprint' || style.glyph === 'webfoot') {
    const stem = s*0.55, toeLen = s*0.5;
    ctx.beginPath(); ctx.moveTo(0, stem*0.4); ctx.lineTo(0, -stem*0.4); ctx.stroke();
    const n = style.toes;
    for (let i=0;i<n;i++) {
      const t = (i/(n-1))-0.5, a = t*style.splay*Math.PI;
      ctx.beginPath(); ctx.moveTo(0,-stem*0.4);
      ctx.lineTo(Math.sin(a)*toeLen+waver, -stem*0.4-Math.cos(a)*toeLen);
      ctx.stroke();
    }
    if (style.glyph === 'webfoot') {
      ctx.globalAlpha *= 0.5;

    }
  }

}

const ARRIVE_RAMP = 9, DEPART_RAMP = 9, VIB_WINDOW = 16; // days
function computeWindow(sp, doy) {
  if (sp.t === 'd' || sp.y) return { presence:1, vibration:0, radiusMix:0 }; // residents and year-round species: always here, calm
  // presence window runs from arrival day to departure day, and may wrap across New Year
  // (winter visitors are here in Jan-Mar and again Sep-Dec, away in summer)
  const arr = sp.f, dep = sp.l;
  const len = ((dep - arr) % 365 + 365) % 365;
  const sinceArrival = (((doy - arr) % 365) + 365) % 365;
  if (sinceArrival > len) return { presence:0, vibration:0, radiusMix:1 };
  const untilDeparture = len - sinceArrival;
  let presence=1, radiusMix=0, vibration=0, arriving=false;
  if (sinceArrival < ARRIVE_RAMP) { const t=sinceArrival/ARRIVE_RAMP; presence=t; radiusMix=1-t; arriving=true; }
  else if (untilDeparture < DEPART_RAMP) { const t=untilDeparture/DEPART_RAMP; presence=t; radiusMix=1-t; }
  if (untilDeparture < VIB_WINDOW && untilDeparture > 0) vibration = 1 - untilDeparture/VIB_WINDOW;
  return { presence, vibration, radiusMix, arriving };
}

/* ---- particles: a few per species so each reads as a small presence, not a single dot ----
   Position is free-scattered across the whole canvas rectangle, not arranged by guild —
   composition (how shapes/colours are laid out before they wriggle and fly off) is an open
   design question for later, not something the simulation should impose by default. ---- */

/* ---- seasonal strength: per species, how strongly it is recorded each month (days reported, from the monthly bars).
   Big flocks swell and thin through the year; each extra particle in a flock has a threshold, and leaves or returns as the level crosses it. ---- */
const LV = DATA.species.map(sp => {
  const mo = sp.mo; if (!mo) return null;
  const mx = Math.max(...mo, 0.001), tab = new Float32Array(365);
  for (let dd=0; dd<365; dd++) {
    const pos = dd/30.4167 - 0.5, m = Math.floor(pos), fr = pos - m, s = fr*fr*(3-2*fr);
    const a = mo[((m%12)+12)%12], b = mo[(((m+1)%12)+12)%12];
    tab[dd] = (a + (b-a)*s)/mx;
  }
  return tab;
});
let EMPH = CLEAN ? 1 : 0.6;   // seasonal emphasis: 0 = the plain data, 1 = each species' own quietest month empties and its busiest fills
const LVMIN = LV.map(t => t ? Math.min(...t) : 0);
function levelAt(si, doy) {
  const tab = LV[si]; if (!tab) return 1;
  const x = ((doy % 365) + 365) % 365, i = Math.floor(x), f = x - i;
  const lv = tab[i]*(1-f) + tab[(i+1)%365]*f;
  if (EMPH <= 0) return lv;
  const mn = LVMIN[si], st = Math.max(0, Math.min(1, (lv-mn)/Math.max(0.2, 1-mn)));
  return lv*(1-EMPH) + st*EMPH;
}
const softP = (lv, q) => { const u = Math.max(0, Math.min(1, (lv-q)/0.12 + 0.5)); return u*u*(3-2*u); };
function computeState(sp, doy, q, si) {
  const st = computeWindow(sp, doy);
  if (!(q > 0) || st.presence <= 0.002) return st;
  const lv = levelAt(si, doy), pl = softP(lv, q);
  let vib = st.vibration;
  if (pl <= 0.05 && softP(levelAt(si, doy-1), q) > pl) vib = 1;   // last stretch of a departure: keep the spin at full so it doesn't snap back
  if (pl > 0.05) { let prev = pl; for (let k=1; k<=16; k++) { const pk = softP(levelAt(si, doy+k), q); if (pk < 0.05) { const kf = (k-1) + (prev-0.05)/Math.max(1e-6, prev-pk); vib = Math.max(vib, 1-kf/16); break; } prev = pk; } }
  return { presence: st.presence*pl, vibration: vib, radiusMix: Math.max(st.radiusMix, 1-pl),
           arriving: st.arriving || (lv > levelAt(si, doy-6)) };
}

/* ---- flocks wander, loosen and regather; individual birds sometimes drift over to join another species ---- */
const flocks = DATA.species.map(() => ({
  bx: 0.14+Math.random()*0.72, by: 0.14+Math.random()*0.72,
  ax: 0.04+Math.random()*0.08, ay: 0.03+Math.random()*0.07,
  fx: 2*Math.PI/(110000+Math.random()*190000), fy: 2*Math.PI/(110000+Math.random()*190000),
  px: Math.random()*6.283, py: Math.random()*6.283,
  lf: 2*Math.PI/(30000+Math.random()*60000), lp: Math.random()*6.283,
  cx: 0.5, cy: 0.5, spread: 1,
}));
function updateFlocks(t) {
  for (const f of flocks) {
    f.cx = f.bx + f.ax*Math.sin(t*f.fx+f.px);
    f.cy = f.by + f.ay*Math.sin(t*f.fy+f.py);
    const L = 0.5+0.5*Math.sin(t*f.lf+f.lp);          // 0 = tight flock, 1 = loose and scattered
    f.spread = 0.8 + 1.6*L*L*L;
  }
}
let particles = [];
DATA.species.forEach((sp, si) => {
  // abundance-based scaling only makes sense where movement is the point:
  // migrants and rarities swarm in real proportion to their recorded numbers
  // (~1 particle per 100 birds, floored at 1). Residents never arrive or
  // depart, so giving them the same treatment just makes the biggest real
  // counts (Starling, Wigeon, Lapwing — all residents) dominate the canvas
  // while sitting still — the opposite of the "residents are the calm
  // ground, migrants are what moves" idea. Residents get a small, capped,
  // fixed footprint instead, regardless of their real count.
  const count = sp.t === 'd'
    ? Math.min(10, Math.max(1, Math.round(Math.sqrt(sp.c)/6)))
    : Math.max(1, Math.round(sp.c/100));

  // a species' particles now form one loose flock rather than scattering
  // independently: a shared cluster centre and a shared flight bearing,
  // with just enough per-particle offset to feel organic rather than rigid
  const clusterX = 0.14 + Math.random()*0.72;
  const clusterY = 0.14 + Math.random()*0.72;
  const clusterSpread = 0.02 + Math.min(0.05, count*0.003); // bigger flocks spread a bit wider
  // real compass bearing where the species' migration route is documented
  // (0=N,90=E,180=S,270=W; converted to canvas radians where +y is down);
  // otherwise no confident single axis (resident, mixed, or ambiguous
  // passage direction), so it keeps an organic, undirected departure
  const flockDepartAngle = (sp.b !== undefined)
    ? (sp.b - 90) * Math.PI/180 + (Math.random()-0.5)*0.35
    : Math.random()*Math.PI*2;

  for (let i=0;i<count;i++) {
    particles.push({
      sp, si,
      arrBlend: 0, q: i/count, qs: 1/count, glowK: 1/Math.sqrt(1+count*0.03),
      offX: (Math.random()-0.5)*clusterSpread*2, offY: (Math.random()-0.5)*clusterSpread*2,
      altSi: Math.floor(Math.random()*DATA.species.length),
      altRate: 2*Math.PI/(70000+Math.random()*110000), altPh: Math.random()*6.283,
      orbA: 0.008+Math.random()*0.02, orbF: 2*Math.PI/(16000+Math.random()*24000), orbP: Math.random()*6.283,
      departAngle: flockDepartAngle + (Math.random()-0.5)*0.5, // stays close to the flock's bearing
      wobblePhaseX: Math.random()*Math.PI*2, wobblePhaseY: Math.random()*Math.PI*2,
      wobbleFreqX: 0.15+Math.random()*0.15, wobbleFreqY: 0.15+Math.random()*0.15,
      timeJitter: (Math.random()-0.5)*2, // tighter than before, so the flock stays together in time too
      size: 1.3+Math.random()*1.6,
      vibSeed: Math.random()*1000,
      rollSeed: Math.random()*6.283, rollSpeed: 0.7+Math.random()*0.8, spinDir: Math.random()<0.5?-1:1, spinTurns: 2+Math.random()*1.5,
      faceJitter: (Math.random()-0.5)*0.9,
    });
  }
});

/* ---- AUDIO: slow ambient/drone treatment (Eno-style) —
   one consistent tonal world all year; only density/activity changes.
   Each guild voice is a small warm chorus of detuned oscillators with
   very slow-moving volume (real data + an independent slow breathing
   cycle per guild, so voices drift past each other rather than all
   reacting to the same instant) and restlessness expressed as a slow
   filter brightening rather than tremolo. ---- */

/* ---- D Dorian (the white notes, as in Ave Maris Stella). Voices walk slowly along it, so every combination stays consonant. ---- */
const DORIAN = [0,2,3,5,7,9,10];                         // semitones above D
const D4_MIDI = 62;
const degToMidi = d => D4_MIDI + 12*Math.floor(d/7) + DORIAN[((d%7)+7)%7];
const midiToHz = m => 440*Math.pow(2,(m-69)/12);
const midiToDeg = m => { for (let d=-21; d<=21; d++) if (degToMidi(d) === m) return d; return 0; };
// register centres (MIDI): kept above ~150 Hz so small TV speakers can reproduce them
const GUILD_MIDI = [55, 74, 62, 53, 67, 69, 60];       // G3, D5 (sample), D4, F3, G4, A4, C4
const walkers = GUILD_MIDI.map(m => ({ centre: midiToDeg(m), deg: midiToDeg(m), next: 0 }));
function seasonShift() { return Math.round(2*Math.sin(2*Math.PI*((typeof day==='number'?day:0)/365))); } // slow modal drift through the year
function stepWalker(w) {

  const choices = [-2,-1,-1,0,1,1,2];

  if (off > 3) d = -Math.abs(d||1); else if (off < -3) d = Math.abs(d||1);   // pull gently back towards the centre
  w.deg += d;
}

const monthEl = document.getElementById('monthlabel'); let monthShown = -1;
function updateMonthLabel(doy){
